], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nIn our latest Material exploration, we began with a simple question: what happens when we challenge the behaviour of material states?\n\nBy developing custom tools and introducing new external influences into our workflow, we generated and applied animated drivers to a conventional aluminium extrusion, classically defined by precision, sharp angles, and strict geometric rules.\n\nSolid forms began to behave like liquids, and rigid structures transformed into intricate, organic networks. What started as a traditional manufacturing method became a system capable of producing highly cellular, nature-inspired complexity.\n\nThe resulting extrusions feel less like machined components and more like living forms - a representation of how the boundaries between the natural and the manufactured can be blurred.\n\nExplore the full project via the link in bio. \n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "note": "依此媒體顯示畫面整理；貼文技術資訊不代表每一畫面的製作方法。", "ratio": "1 / 1"}, {"id": "discovered-DbGbbtjCFb7-1", "post_id": "DbGbbtjCFb7", "title": "Glenfiddich F1 · 輪廓光", "subtitle": "GLENFIDDICH F1", "creator": "found_studio", "image": "https://instagram.ftpe8-3.fna.fbcdn.net/v/t51.82787-15/751692391_18608244040004147_6179329383780308197_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=107&ig_cache_key=Mzk0Njk2MjU0MjIzMjUyNzQ0Mw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTkyMC5zZHIudmlkZW9fZGVmYXVsdF9jb3Zlcl9mcmFtZS5DMyJ9&_nc_ohc=vHlrv-FQjFIQ7kNvwH2EUuw&_nc_oc=Adp6umZwOJEYoeEflzLfk7jXPAiCma6TZ-CXia5opkD6y6pCpiCjbHR3cxu8Ro6yyX8&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-3.fna&_nc_gid=f-aLw4VTRpxX9cmywtyK4A&_nc_ss=7a22e&oh=00_AQLzXD7k7tpJ5Jau5yqZLWu0zUFUxrQrWBkXfElEWshTRw&oe=6AA5C94A", "url": "https://www.instagram.com/found_studio/p/DbGbbtjCFb7/?img_index=1", "group": "discovered", "saved": false, question: what happens when we challenge the behaviour of material states?\n\nBy developing custom tools and introducing new external influences into our workflow, we generated and applied animated drivers to a conventional aluminium extrusion, classically defined by precision, sharp angles, and strict geometric rules.\n\nSolid forms began to behave like liquids, and rigid structures transformed into intricate, organic networks. What started as a traditional manufacturing method became a system capable of producing highly cellular, nature-inspired complexity.\n\nThe resulting extrusions feel less like machined components and more like living forms - a representation of how the boundaries between the natural and the manufactured can be blurred.\n\nExplore the full project via the link in bio. \n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "note": "依此媒體顯示畫面整理；貼文技術資訊不代表每一畫面的製作方法。", "ratio": "1 / 1"}, {"id": "discovered-DbGbbtjCFb7-2", "post_id": "DbGbbtjCFb7", "title": "Glenfiddich F1 · 環形光軌", "subtitle": "GLENFIDDICH F1", "creator": "found_studio", "image": "https://instagram.ftpe8-1.fna.fbcdn.net/v/t51.82787-15/754068607_18608243974004147_8441665235780601463_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=105&ig_cache_key=Mzk0Njk2Mjc1NTAyNjIwMTc5OA%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=dzP0x0RXrccQ7kNvwE0hVy2&_nc_oc=Adoc9Dhrhu6lqwVVMSSAHzfhrFnNCwP2cLnqMh5l7fauS_JUv5mFs6q5lP5lvKFTWCE&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-1.fna&_nc_gid=f-aLw4VTRpxX9cmywtyK4A&_nc_ss=7a22e&oh=00_AQKce_nbI2uRMUbiTzq9zXKt_QxiKc1yV2LWlvBYUEkW8Q&oe=6AA5CCD8", "url": "https://www.instagram.com/found_studio/p/DbGbbtjCFb7/?img_index=2", "group": "discovered", "saved": false, "collection": "相關 CG", "project": "Glenfiddich F1", "index": 2, "total": 4, "type": "image", "duration": "", "description": "青綠色和黃色光軌環繞酒瓶，形成高速圓環。", "t const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groups=[['全部',''],['金屬 Metal','metal'],['流體 Fluid','fluid'],['粒子 Particle','particle'],['波浪 Wave','wave'],['布料 Cloth','cloth'],['信用卡 Card','credit card'],['線條 Line','line'],['鞋履 Footwear','footwear']];
const synonyms=[['ripple','wave','waves','波','波浪','漣漪','波紋','波動'],['cloth','fabric','garment','布','布料','織物','衣料'],['footwear','shoe','sole','outsole','鞋','鞋底','鞋類'],['crystal','snowflake','frost','ice','snow','晶體','冰','雪','雪花','霜'],['fluid','water','droplet','liquid','流體','水','水滴','液滴','液體'],['line','curve','線','線條','曲線'],['particle','granular','swarm','粒子','顆粒','群聚'],['metal','metallic','金屬','金屬感'],['credit card','card','信用卡','卡片'],['typography','text','字體','文字'],['glow','light trails','光軌','發光']];
let selected='';

// Sources stay unset until the media approaches the viewport.
function video(i,detail=false){
 if(i.type!=='video'||!/^https:\/\//.test(i.video_url||''))return '';
 return `<video data-video-src="${esc(i.video_url)}" muted playsinline loop preload="none" ${detail?'controls':''} aria-label="${esc(i.title)}"></video>`;
}
const visibleVideos=new Set();
function canPlay(v){return !document.hidden&&(!$('#modal').open||$('#detail').contains(v))}
function startVideo(v){
 if(!canPlay(v)||v.dataset.failed)return;
 if(!v.getAttribute('src')){v.src=v.dataset.videoSrc;v.muted=true;v.load()}
 const playing=v.play();if(playing)playing.then(()=>{if(!visibleVideos.has(v)||!canPlay(v))v.pause()}).catch(()=>{v.classList.remove('is-playing')});
}
function pauseAll(){document.querySelectorAll('video').forEach(v=>v.pause())}
function syncPlayback(){visibleVideos.forEach(v=>{if(canPlay(v))startVideo(v);else v.pause()})}
const imageObserver=typeof IntersectionObserver==='undefined'?null:new IntersectionObserver(entries=>{
 entries.forEach(({target,isIntersecting})=>{if(isIntersecting){target.src=target.dataset.src;imageObserver.unobserve(target)}});
},{rootMargin:'180px 0px'});
const videoObserver=typeof IntersectionObserver==='undefined'?null:new IntersectionObserver(entries=>{
 entries.forEach(({target,isIntersecting,intersectionRatio})=>{
  if(isIntersecting&&intersectionRatio>=0.25){visibleVideos.add(target);startVideo(target)}
  else{visibleVideos.delete(target);target.pause()}
 });
},{threshold:[0,0.25]});
function observeMedia(root){
 root.querySelectorAll('img[data-src]').forEach(img=>{if(imageObserver)imageObserver.observe(img);else img.src=img.dataset.src});
 root.querySelectorAll('video[data-video-src]').forEach(v=>{
  v.muted=true;
  v.addEventListener('playing',()=>v.classList.add('is-playing'));
  v.addEventListener('error',()=>{v.dataset.failed='true';v.classList.remove('is-playing');v.pause()});
  if(videoObserver)videoObserver.observe(v);else v.controls=true;
 });
}
function releaseMedia(root){
 root.querySelectorAll('img').forEach(img=>imageObserver?.unobserve(img));
 root.querySelectorAll('video').forEach(v=>{videoObserver?.unobserve(v);visibleVideos.delete(v);v.pause();v.removeAttribute('src');v.load()});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll();else syncPlayback()});
window.addEventListener('pagehide',pauseAll);

function expand(q){q=q.toLowerCase().trim().replace(/^#/,'');return [...new Set([q,...synonyms.filter(g=>g.includes(q)).flat()])].filter(Boolean)}
function hay(i){return [i.title,i.creator,i.description,i.collection,i.caption_text,...i.tags.flatMap(t=>[t.en,t.zh]),...i.related.flatMap(t=>[t.en,t.zh]),...i.caption].join(' ').toLowerCase()}
function matches(i,q){const terms=expand(q);return !terms.length||terms.some(w=>hay(i).includes(w))}
function image(i,extra=''){return `<img data-src="${esc(i.image)}" decoding="async" loading="lazy" alt="${esc(i.title)}" referrerpolicy="no-referrer" ${extra}>`}
function tag(t,cls=''){return `<button class="tag ${cls}" data-query="${esc(t.en)}">${esc(t.en)}${t.en.toLowerCase()!==t.zh.toLowerCase()?' · '+esc(t.zh):''}</button>`}
function scope(i){return i.group==='ref'?'延伸貼文預覽':i.total>1?`輪播 ${i.index} / ${i.total}`:'獨立影片'}
function badge(i){return i.group==='ref'?'↗ 延伸參考':i.type==='image'?'▧ 圖片':'▶ '+i.duration}
function render(){
 releaseMedia($('#grid'));
 const q=$('#search').value.trim(),source=$('#group').value,collection=$('#collection').value;
 const shown=items.filter(i=>matches(i,q)&&matches(i,selected)&&(source==='all'||(source==='saved'?i.saved:i.group===source))&&(collection==='all'||i.collection===collection));
 $('#filters').innerHTML=groups.map(([name,value])=>`<button class="chip ${selected===value?'active':''}" data-filter="${value}" aria-pressed="${selected===value}">${name}</button>`).join('');
 $('#count').textContent=`${shown.length} 個參考素材${q?' · 搜尋「'+q+'」':''}`;
 const expanded=expand(q).filter(w=>w!==q.toLowerCase());$('#expanded').textContent=expanded.length?'關聯搜尋：'+expanded.join(' · '):'每個輪播項目，獨立探索';
 $('#empty').style.display=shown.length?'none':'block';
 $('#grid').innerHTML=shown.map(i=>`<article class="card"><button class="visual" data-open="${i.id}" style="--ratio:${i.ratio}" aria-label="查看${esc(i.title)}">${image(i)}${video(i)}<span class="fallback">預覽連結暫時無法載入<br>點此查看素材與原文 ↗</span><span class="badge">${badge(i)}</span><span class="index">${esc(scope(i))}${i.saved?' · 我的收藏':''}</span><span class="arrow">↗</span></button><div class="cardbody"><div class="subtitle">${esc(i.subtitle)}</div><button class="title" data-open="${i.id}">${esc(i.title)}</button><p class="creator">${esc(i.creator)}</p><div class="tags">${i.tags.slice(0,3).map(t=>tag(t)).join('')}</div></div></article>`).join('');
 observeMedia($('#grid'));
 $('#grid').querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>img.closest('.card').classList.add('broken')));
}
function openItem(id){
 const i=items.find(i=>i.id===id);if(!i)return;
 releaseMedia($('#detail')); pauseAll();
 const keys=i.tags.map(t=>t.en.toLowerCase());
 const similar=items.filter(j=>j.id!==id).map(j=>({j,score:j.tags.reduce((n,t)=>n+keys.includes(t.en.toLowerCase()),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
 $('#detail').innerHTML=`<div class="detail"><div class="preview">${video(i,true)||image(i)}<a class="source" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${i.type==='video'?'觀看原影片':'開啟原貼文'} ↗</a></div><div class="detailbody"><div class="eyebrow">${esc(scope(i))}${i.collection?' / '+esc(i.collection):''}</div><h2>${esc(i.title)}</h2><p>@${esc(i.creator)}${i.published_at?' · 發布於 '+esc(i.published_at.slice(0,10)):''}</p><p>${esc(i.description)}</p><h3>個別素材標籤</h3><div class="tags">${i.tags.map(t=>tag(t)).join('')}</div>${i.related.length?'<h3>延伸搜尋詞 · 非已確認技術</h3><div class="tags">'+i.related.map(t=>tag(t,'relatedtag')).join('')+'</div>':''}${i.caption.length?'<h3>貼文 Hashtags</h3><div class="tags">'+i.caption.map(t=>`<button class="tag" data-query="${esc(t)}">#${esc(t)}</button>`).join('')+'</div>':''}${i.caption_text?'<details class="caption"><summary>查看原貼文文字</summary><p>'+esc(i.caption_text)+'</p></details>':''}<p class="note">${esc(i.note)}</p>${similar.length?'<h3>繼續探索相關素材</h3><div class="relatedgrid">'+similar.map(({j})=>`<button class="smallcard" data-open="${j.id}">${image(j)}${esc(j.title)}</button>`).join('')+'</div>':''}</div></div>`;
 if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0;observeMedia($('#detail'));
}
function reset(){selected='';$('#search').value='';$('#group').value='all';$('#collection').value='all';render()}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]'),q=e.target.closest('[data-query]'),f=e.target.closest('[data-filter]');if(o)openItem(o.dataset.open);if(q){$('#search').value=q.dataset.query;selected='';$('#group').value='all';$('#collection').value='all';$('#modal').close();render();window.scrollTo({top:0,behavior:'smooth'})}if(f){selected=f.dataset.filter;render()}});
$('#search').addEventListener('input',render);$('#group').addEventListener('change',render);$('#collection').addEventListener('change',render);
$('#clear').onclick=()=>{$('#search').value='';render();$('#search').focus()};$('#reset').onclick=reset;$('#home').onclick=$('#explore').onclick=e=>{e.preventDefault();reset();window.scrollTo({top:0,behavior:'smooth'})};$('#close').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});
$('#modal').addEventListener('close',()=>{releaseMedia($('#detail'));syncPlayback()});
render();

</script></body></html>

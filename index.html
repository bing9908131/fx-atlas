 [], "caption_text": "We partnered with @questrade on their rebrand, translating nearly 25 years of legacy into a new motion and 3D system with the brand direction and strategy by @porto_rocha.\n\nInspired by movement and physics, we explored ways to give structure to abstract financial concepts. Physical instruments became visual metaphors for each product, creating a logic that makes these ideas feel tangible and functional. Each product becomes its own mechanism, building toward one larger system.\n\nThank you to Questrade for the opportunity to play such a central role in this work, and glad to be working alongside some familiar faces on this one! 💫", "published_at": "2026-08-20T21:09:55.000Z", "project": "Questrade", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "479 / 599"}, {"id": "year-DcdDmM6j5Cq-1", "post_id": "DcdDmM6j5Cq", "title": "發光建築方塊", "subtitle": "Graphite Scanning", "creator": "panoplycreative", "publisher": "panoplycreative", "production_company": "Panoply", "collaborators": [], "image": "https://instagram.ftpe8-1.fna.fbcdn.net/v/t51.71878-15/786213230_1036030329432254_3260610006280793760_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=109&ig_cache_key=Mzk3MTM0NDk5NDk4NDIwNTQ1Ng%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuNjQwLnNkci52aWRlb19kZWZhdWx0X2NvdmVyX2ZyYW1lLkMzIn0%3D&_nc_ohc=6jUX4ZcKoXQQ7kNvwHdBS-X&_nc_oc=Adp8GOBQKJ4uqXx5_D9tcbUW_47k6XtG_GQK1ax2BoBV7vWVd2mSqph60cKEzO4M_rY&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-1.fna&_nc_gid=dMd9RB-X1AYBEocyoy4A-w&_nc_ss=7a22e&oh=00_AQIQJsqhqLFEzakOF3KtkoOcVwI9G5-BD7IztEoF88OTNQ&oe=6AA5C8A2", "url": "https://www.instagram.com/panoplycreative/p/DcdDmM6j5Cq/?img_index=1", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 1, "total": 4, "type": "video", "duration": "4.0s", "description": "金色光線穿透大型建築方塊", "tags": [{"en": "architecture", "zh": "建築", "source": "visual"}, {"en": "glow", "zh": "發光", "source": "visual"}, {"en": "scanning", "zh otive campaigns. The interplay of light reveals the silhouette from darkness, spotlighting details such as the intricate honeycomb metal injection molding craftsmanship and precision-etched numbering.\n\nEvery frame channels the visceral energy, speed, and precision that define Formula 1.\n\nExplore more on our website - link in the bio.\n\nClient: McLaren Golf\nECD: Clayton Welham\nExecutive Producers: Felix Jude West, Sean Harry\nCreative Lead: Manuel Camino\nDesigners: Jonathan May, Arran Bish, David Rencsenyi, Vincenzo Memeo", "published_at": "2026-07-16T14:59:52.000Z", "project": "McLaren Golf", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DaVAtBOCO4U-2", "post_id": "DaVAtBOCO4U", "title": "形態框線研究", "subtitle": "Meta States", "creator": "found_studio", "publisher": "found_studio", "production_company": "Found Studio", "collaborators": [], "image": "https://instagram.ftpe8-3.fna.fbcdn.net/v/t51.82787-15/729068565_18602468581004147_5705390446479972941_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=106&ig_cache_key=MzkzMzA1MjY2MTMzOTQxMjIyNg%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIudmlkZW9fZGVmYXVsdF9jb3Zlcl9mcmFtZS5DMyJ9&_nc_ohc=nwncrEBSaTUQ7kNvwFXaItj&_nc_oc=AdrmSKNk3jZtItRsv_mUFmK5TBHG9xDAiHnbS2dDUQSAKR_k9Z1WOaf4IAi_2-NEYso&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-3.fna&_nc_gid=LiCZhJHz3KIBYZ97QnPumg&_nc_ss=7a22e&oh=00_AQIi8TiJaN422y_ALGJHps1VULuL8e4MhriToPJwV-Wv9w&oe=6AA5DFD6", "url": "https://www.instagram.com/found_studio/p/DaVAtBOCO4U/?img_index=2", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 2, "total": 8, "type": "video", "duration": "8.0s", "description": "白色曲面疊加紅色結構框線", "tags": [{"en": "wireframe", "zh": "線框", "source": "visual"}, {"en": "curve", "zh": "曲線", "source": "visual"}, {"en": "geometry", "zh": "幾何", "source": "visual"}], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nContinuing our exploration, we reversed the process to see what happens when a liquid is encouraged to behave as a solid.\n\nCode-driven animated assets allowed us to explore the boundary between liquid and solid states, where materials fracture and extrude while retaining fluid characteristics. This biphasic state revealed forms that exist between both conditions simultaneously.\n\nOur research shows that materials can exist between states, holding characteristics of both opening up new possibilities for designing flexible, adaptive structures.\n\nRead the full case study via the link in the bio.\n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "published_at": "2026-07-03T11:01:12.000Z", "project": "Meta States", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DafokFNjur6-2", "post_id": "DafokFNjur6", "title": "手錶線框透視", "subtitle": "Hublot", "creator": "studiotendril", "publisher": "studiotendril", "production_company": "Tendril", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/734574516_18597759994007411_6291248619975404024_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=104&ig_cache_key=MzkzNjAzNzkxMzI0MTMzNDkyNQ%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=rlbZR1yhBWkQ7kNvwF3IGJj&_nc_oc=AdqSpDNs_ak98eWZrRLJPXiF2P99TV6ypnKs7chIccJpoNVFrPAjuS858gFbvyEDofc&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=PFFAniLtpkNODZ8pwxUFAQ&_nc_ss=7a22e&oh=00_AQL-aXXbeVwucmSEMPqPTSktV-SoG2N-12YRfDQGaR3C4Q&oe=6AA5B915", "url": "https://www.instagram.com/studiotendril/p/DafokFNjur6/?img_index=2", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 2, "total": 8, "type": "image", "duration": "", "description": "白色線框顯示完整手錶內部", "tags": [{"en": "watch", "zh": "手錶", "source": "visual"}, {"en": "wireframe", "zh": "線框", "source": "visual"}, {"en": "xray", "zh": "透視", "so 25347_18606409447004147_4932941318177914688_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=105&ig_cache_key=Mzk0MjU4OTE5NjY2NTQxNjAxNA%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTkyMC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=Ru5acZC66yYQ7kNvwHy8adx&_nc_oc=AdrARniOiauWDhMjvopKF-CF04XQyIK3lwjjxegOAM6Gn_WLzmswCwpbCV6y5eKY3Xs&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-1.fna&_nc_gid=QFc2e6UFI0QgzjEhejxGTg&_nc_ss=7a22e&oh=00_AQIGJlE_D0ceIxcQpBjTsoAdGQJcgE2HQO4pX15FV8hAoA&oe=6AA5BBE2", "url": "https://www.instagram.com/found_studio/p/Da25AFXiLfV/?img_index=3", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 3, "total": 6, "type": "image", "duration": "", "description": "球桿頭零件在橘色背景中分離", "tags": [{"en": "golf", "zh": "高爾夫", "source": "visual"}, {"en": "exploded view", "zh": "爆炸圖", "source": "visual"}, {"en": "assembly", "zh": "組裝", "source": "visual"}], "related": [], "caption": [], "caption_text": "Translating the thrill of racing heritage into groundbreaking golf engineering.\n\nOur launch film for the all-new @mclarengolf Series 1 and 3 irons showcases an engineering powerhouse built for distance and defined by technical precision.\n\nTo launch the series, we developed a set of films inspired by the visual language of luxury automotive campaigns. The interplay of light reveals the silhouette from darkness, spotlighting details such as the intricate honeycomb metal injection molding craftsmanship and precision-etched numbering.\n\nEvery frame channels the visceral energy, speed, and precision that define Formula 1.\n\nExplore more on our website - link in the bio.\n\nClient: McLaren Golf\nECD: Clayton Welham\nExecutive Producers: Felix Jude West, Sean Harry\nCreative Lead: Manuel Camino\nDesigners: Jonathan May, Arran Bish, David Rencsenyi, Vincenzo Memeo", "published_at": "2026-07-16T14:59:52.000Z", "project": "McLaren Golf", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DaVAt ed_at": "2026-07-03T11:01:12.000Z", "project": "Meta States", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DafokFNjur6-3", "post_id": "DafokFNjur6", "title": "藍色機芯動態", "subtitle": "Hublot", "creator": "studiotendril", "publisher": "studiotendril", "production_company": "Tendril", "collaborators": [], "image": "https://instagram.ftpe8-1.fna.fbcdn.net/v/t51.82787-15/732215423_18597760372007411_6901020101720010111_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=109&ig_cache_key=MzkzNjAzODEzNTU5NTQ2MjgzOQ%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuNzIwLnNkci52aWRlb19kZWZhdWx0X2NvdmVyX2ZyYW1lLkMzIn0%3D&_nc_ohc=p2kjzsjJ2SIQ7kNvwE4E5Cd&_nc_oc=AdoOr8Eqx7ipJz51jhuVzlFxqQHZ2KmCu_T3BK3-E--7uLUN1Ou-8S4AQm6Yv_0KKg8&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-1.fna&_nc_gid=PFFAniLtpkNODZ8pwxUFAQ&_nc_ss=7a22e&oh=00_AQLFTJtUNcTwxXTBdm-4yBkZMEro8BtRCfSE3laDSS7mSg&oe=6AA5B6FC", "url": "https://www.instagram.com/studiotendril/p/DafokFNjur6/?img_index=3", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 3, "total": 8, "type": "video", "duration": "2.8s", "description": "藍色機芯帶有旋轉運動模糊", "tags": [{"en": "watch", "zh": "手錶", "source": "visual"}, {"en": "motion blur", "zh": "運動模糊", "source": "visual"}, {"en": "rotation", "zh": "旋轉", "source": "visual"}], "related": [], "caption": ["hublot", "tendril", "design", "rnd", "reel"], "caption_text": "Time is a construct.⏳\n\nSo we reconstructed it, dissecting the architecture that builds every second. The chronograph works in open view, revealing the precision engineered into every component.\n\nAs the watch comes apart, so does our perception of time. Fast becomes slow. Slow becomes fast. Frames stretch, distort, fracture, and fall out of sync, turning digital artifacts into visual traces of time unravelling. Yet at the centre, the mechanism never loses its rhythm.\n\nShout out to @pauljdalton for the insane edit. And to @un.studios for the equally in 97QnPumg&_nc_ss=7a22e&oh=00_AQJ9UlGFwpedTw1EWSfrJakuAzEqTuN64K3io8D3Q_dx9A&oe=6AA5D458", "url": "https://www.instagram.com/found_studio/p/DaVAtBOCO4U/?img_index=4", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 4, "total": 8, "type": "image", "duration": "", "description": "不規則透明碎片沿縱向排列", "tags": [{"en": "fragment", "zh": "碎片", "source": "visual"}, {"en": "transparent", "zh": "透明", "source": "visual"}, {"en": "organic", "zh": "有機形態", "source": "visual"}], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nContinuing our exploration, we reversed the process to see what happens when a liquid is encouraged to behave as a solid.\n\nCode-driven animated assets allowed us to explore the boundary between liquid and solid states, where materials fracture and extrude while retaining fluid characteristics. This biphasic state revealed forms that exist between both conditions simultaneously.\n\nOur research shows that materials can exist between states, holding characteristics of both opening up new possibilities for designing flexible, adaptive structures.\n\nRead the full case study via the link in the bio.\n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "published_at": "2026-07-03T11:01:12.000Z", "project": "Meta States", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DafokFNjur6-4", "post_id": "DafokFNjur6", "title": "紅藍錶殼對照", "subtitle": "Hublot", "creator": "studiotendril", "publisher": "studiotendril", "production_company": "Tendril", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/732841107_18597759997007411_7125599281474950548_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=104&ig_cache_key=MzkzNjAzNzkxMjk2NDUyMzcxNQ%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=UevPgV2otSIQ7kNvwGS8qn9&_nc_oc=AdqCZhv4twVdsk5s h as the intricate honeycomb metal injection molding craftsmanship and precision-etched numbering.\n\nEvery frame channels the visceral energy, speed, and precision that define Formula 1.\n\nExplore more on our website - link in the bio.\n\nClient: McLaren Golf\nECD: Clayton Welham\nExecutive Producers: Felix Jude West, Sean Harry\nCreative Lead: Manuel Camino\nDesigners: Jonathan May, Arran Bish, David Rencsenyi, Vincenzo Memeo", "published_at": "2026-07-16T14:59:52.000Z", "project": "McLaren Golf", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DaVAtBOCO4U-5", "post_id": "DaVAtBOCO4U", "title": "深色玻璃微距", "subtitle": "Meta States", "creator": "found_studio", "publisher": "found_studio", "production_company": "Found Studio", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/728783510_18602468485004147_3695055277744659390_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=102&ig_cache_key=MzkzMzA1MjkxNjM3ODE0ODI2OA%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=zD-wZaWPmukQ7kNvwG3ipEC&_nc_oc=Ado438v1qVtxkUU_dyfNQW-ZXvrhieDnurcTYdug4P1ADoSav8mamX6uB9xRxIqziDI&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=LiCZhJHz3KIBYZ97QnPumg&_nc_ss=7a22e&oh=00_AQJKUcvxGvUrahH8fInKuBSoauMUStyfgMFW4g3rtn1BFw&oe=6AA5CC93", "url": "https://www.instagram.com/found_studio/p/DaVAtBOCO4U/?img_index=5", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 5, "total": 8, "type": "image", "duration": "", "description": "深色透明曲面內有細小亮點", "tags": [{"en": "glass", "zh": "玻璃", "source": "visual"}, {"en": "macro", "zh": "微距", "source": "visual"}, {"en": "particle", "zh": "粒子", "source": "visual"}], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nContinuing our exploration, we reversed the process to see what happens when a liquid is encouraged to behave as a solid.\n\nCode-driven animated assets allowed us to explore the boundary between liquid and solid states, where materials fracture and extrude while retaining fluid characteristics. This biphasic state revealed forms that exist between both conditions simultaneously.\n\nOur research shows that materials can exist between states, holding characteristics of both opening up new possibilities for designing flexible, adaptive structures.\n\nRead the full case study via the link in the bio.\n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "published_at": "2026-07-03T11:01:12.000Z", "project": "Meta States", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DafokFNjur6-5", "post_id": "DafokFNjur6", "title": "手錶與橘色光影", "subtitle": "Hublot", "creator": "studiotendril", "publisher": "studiotendril", "production_company": "Tendril", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/732632057_18597760021007411_6788407519586378376_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=102&ig_cache_key=MzkzNjAzNzkyNTUzOTE1NjQzMw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=8skUtpZ6F5AQ7kNvwHPrGaU&_nc_oc=AdqOAcrFW3_IGj3db0ERuvdKpiJJzFSKjEfIvYR0R8hCllC4xMLpriINuxjnl0o_GRc&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=PFFAniLtpkNODZ8pwxUFAQ&_nc_ss=7a22e&oh=00_AQKxoN5esGrB6LWQPhz7zuNTvUY7WJpl6cCl58lkggI4IA&oe=6AA5D493", "url": "https://www.instagram.com/studiotendril/p/DafokFNjur6/?img_index=5", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 5, "total": 8, "type": "image", "duration": "", "description": "金屬手錶疊加橘色弧形光影", "tags": [{"en": "watch", "zh": "手錶", "source": "visual"}, {"en": "light trail", "zh": "光跡", "source": "visual"}, {"en": "metal", "zh": "金屬", "source": "visual"}], "related": [], "caption": ["hublot", "tendril", "design", "rnd", "reel"], "caption_text": "Time is a co t, Sean Harry\nCreative Lead: Manuel Camino\nDesigners: Jonathan May, Arran Bish, David Rencsenyi, Vincenzo Memeo", "published_at": "2026-07-16T14:59:52.000Z", "project": "McLaren Golf", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DaVAtBOCO4U-6", "post_id": "DaVAtBOCO4U", "title": "尖角柱體草圖", "subtitle": "Meta States", "creator": "found_studio", "publisher": "found_studio", "production_company": "Found Studio", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/722994559_18602468518004147_8758098423945689564_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=104&ig_cache_key=MzkzMzA1MjkxNjQyODQ0NDg3Ng%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTY1MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=7wXx9frWjdMQ7kNvwEXSvrf&_nc_oc=AdpfU6M5Z1irs2GqMCDf_Fwrp5smkvFvtMne4cvRho5FM86OcGKxdxpYr5A88dN1YGg&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=LiCZhJHz3KIBYZ97QnPumg&_nc_ss=7a22e&oh=00_AQI70XnONgr47SohTngcR86cjjPBbqzaSSQ8754fy52iRA&oe=6AA5D8E5", "url": "https://www.instagram.com/found_studio/p/DaVAtBOCO4U/?img_index=6", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 6, "total": 8, "type": "image", "duration": "", "description": "鉛筆風格尖角柱體形態圖", "tags": [{"en": "sketch", "zh": "草圖", "source": "visual"}, {"en": "extrusion", "zh": "擠出", "source": "visual"}, {"en": "angular", "zh": "尖角", "source": "visual"}], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nContinuing our exploration, we reversed the process to see what happens when a liquid is encouraged to behave as a solid.\n\nCode-driven animated assets allowed us to explore the boundary between liquid and solid states, where materials fracture and extrude while retaining fluid characteristics. This biphasic state revealed forms that exist between both conditions simultaneously.\n\nOur research shows that materials can exist between states, holding characteristics of both opening up new possibilities for designing flexible, adaptive structures.\n\nRead the full case study via the link in the bio.\n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "published_at": "2026-07-03T11:01:12.000Z", "project": "Meta States", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DafokFNjur6-6", "post_id": "DafokFNjur6", "title": "機芯拼貼", "subtitle": "Hublot", "creator": "studiotendril", "publisher": "studiotendril", "production_company": "Tendril", "collaborators": [], "image": "https://instagram.ftpe8-1.fna.fbcdn.net/v/t51.82787-15/740836260_18597760363007411_2603074399699485202_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=105&ig_cache_key=MzkzNjAzODE0NDIxODkwNjMzNw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuNzIwLnNkci52aWRlb19kZWZhdWx0X2NvdmVyX2ZyYW1lLkMzIn0%3D&_nc_ohc=zc5kM7b4kQMQ7kNvwF_ZRnE&_nc_oc=AdpuMmHEVOhdAqslgHLGRiFpYvAH0QTBfcKuKkjzW-6nY2vLB2nSgOL2HF24si1QBPk&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-1.fna&_nc_gid=PFFAniLtpkNODZ8pwxUFAQ&_nc_ss=7a22e&oh=00_AQL7Lt_rQ02i8vKg1oXCNMiGM8UYJmXe3JIMZElCDpoZtg&oe=6AA5EA1A", "url": "https://www.instagram.com/studiotendril/p/DafokFNjur6/?img_index=6", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 6, "total": 8, "type": "video", "duration": "5.4s", "description": "金屬齒輪與機芯細節拼貼", "tags": [{"en": "gear", "zh": "齒輪", "source": "visual"}, {"en": "mechanical", "zh": "機械", "source": "visual"}, {"en": "collage", "zh": "拼貼", "source": "visual"}], "related": [], "caption": ["hublot", "tendril", "design", "rnd", "reel"], "caption_text": "Time is a construct.⏳\n\nSo we reconstructed it, dissecting the architecture that builds every second. The chronograph works in open view, revealing the precision engineered into every component.\n\nAs the watch comes apart, so does our perception of time. Fast becomes slow. Slow becomes fast. Frames stretch, nCode-driven animated assets allowed us to explore the boundary between liquid and solid states, where materials fracture and extrude while retaining fluid characteristics. This biphasic state revealed forms that exist between both conditions simultaneously.\n\nOur research shows that materials can exist between states, holding characteristics of both opening up new possibilities for designing flexible, adaptive structures.\n\nRead the full case study via the link in the bio.\n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "published_at": "2026-07-03T11:01:12.000Z", "project": "Meta States", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "889 / 889"}, {"id": "year-DafokFNjur6-8", "post_id": "DafokFNjur6", "title": "透明藍色錶殼", "subtitle": "Hublot", "creator": "studiotendril", "publisher": "studiotendril", "production_company": "Tendril", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/731483023_18597760000007411_8319673401477598573_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=102&ig_cache_key=MzkzNjAzNzkwODgzNzM5NjYyNw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=OgaiN4_WnTYQ7kNvwHZZtYM&_nc_oc=Adqg_M_GuWY_UT-doq_RYOSIOUM9k5mzCdXKwZGwAsmkezjFhgp_mxYwtmaBiOmphB4&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=PFFAniLtpkNODZ8pwxUFAQ&_nc_ss=7a22e&oh=00_AQJCZrzI51Zj1vTRSjkUdAYnIDR5f1CNYhKuUrsZpHDVUw&oe=6AA5E16B", "url": "https://www.instagram.com/studiotendril/p/DafokFNjur6/?img_index=8", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 8, "total": 8, "type": "image", "duration": "", "description": "透明錶殼露出內部機芯", "tags": [{"en": "watch", "zh": "手錶", "source": "visual"}, {"en": "transparent", "zh": "透明", "source": "visual"}, {"en": "refraction", "zh": "折射", "source": "visual"}], "related": [], "caption": ["hublot", "tendril", "design", "rnd", "reel"], "caption_text": "Time is a construct.⏳\n\nSo we reconstructed it, dissecting the architecture that builds every second. The chronograph works in open view, revealing the precision engineered into every component.\n\nAs the watch comes apart, so does our perception of time. Fast becomes slow. Slow becomes fast. Frames stretch, distort, fracture, and fall out of sync, turning digital artifacts into visual traces of time unravelling. Yet at the centre, the mechanism never loses its rhythm.\n\nShout out to @pauljdalton for the insane edit. And to @un.studios for the equally insane soundtrack. 🤩\n\nAnd thank you to @yannlauener, @frederic_dalberto , and the @hublot team for the partnership that never ceases to excite us.\n\n#hublot #tendril #design #rnd #reel", "published_at": "2026-07-07T15:35:56.000Z", "project": "Hublot", "note": "依此獨立素材顯示畫面與原貼文整理；未推定未署名模擬技術。", "ratio": "479 / 599"}, {"id": "year-DbI0_wnDByH-8", "post_id": "DbI0_wnDByH", "title": "刷毛粒子特寫", "subtitle": "Revolut Particle R&D", "creator": "mondlichtstudios", "publisher": "mondlichtstudios", "production_company": "Mondlicht Studios", "collaborators": [], "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/755062561_18200246191371451_1127604236210004799_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=102&ig_cache_key=Mzk0NzYzNDM3NTE3MTE5MzI0Mw%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=z1ackh72gOkQ7kNvwGh5ZUo&_nc_oc=AdpTxwiem-otUkiSO2PTCXX1DDf79XI6BLZ3Fex1aShRSXleZwn4A08F8elHwJ13XRs&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=HwNV4dGAM99f7avRzJvXgQ&_nc_ss=7a22e&oh=00_AQJmM6YLLKK3py9W7F1KR7zBYaZV7ZVLrVzsX5eSSq3alQ&oe=6AA5BC41", "url": "https://www.instagram.com/mondlichtstudios/p/DbI0_wnDByH/?img_index=8", "group": "year", "collection": "2026 年 CG 精選", "saved": false, "index": 8, "total": 12, "type": "image", "duration": "", "description": "刷毛與粉色粒子包圍卡片", "tags": [{"en": "brush", "zh": " =6AA5BDD8", "url": "https://www.instagram.com/found_studio/p/DaQHInfCHSS/?img_index=2", "group": "discovered", "saved": false, "collection": "相關 CG", "project": "Meta States", "index": 2, "total": 6, "type": "image", "duration": "", "description": "銀色直立柱體頂部呈現三角尖角與中空隔間。", "tags": [{"en": "metal", "zh": "金屬", "source": "visual"}, {"en": "extrusion", "zh": "擠出", "source": "visual"}, {"en": "triangle", "zh": "三角形", "source": "visual"}, {"en": "structure", "zh": "結構", "source": "visual"}], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nIn our latest Material exploration, we began with a simple question: what happens when we challenge the behaviour of material states?\n\nBy developing custom tools and introducing new external influences into our workflow, we generated and applied animated drivers to a conventional aluminium extrusion, classically defined by precision, sharp angles, and strict geometric rules.\n\nSolid forms began to behave like liquids, and rigid structures transformed into intricate, organic networks. What started as a traditional manufacturing method became a system capable of producing highly cellular, nature-inspired complexity.\n\nThe resulting extrusions feel less like machined components and more like living forms - a representation of how the boundaries between the natural and the manufactured can be blurred.\n\nExplore the full project via the link in bio. \n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "note": "依此媒體顯示畫面整理；貼文技術資訊不代表每一畫面的製作方法。", "ratio": "1 / 1"}, {"id": "discovered-DbGbbtjCFb7-2", "post_id": "DbGbbtjCFb7", "title": "Glenfiddich F1 · 環形光軌", "subtitle": "GLENFIDDICH F1", "creator": "found_studio", "image": "https://instagram.ftpe8-1.fna.fbcdn.net/v/t51.82787-15/754068607_18608243974004147_8441665235780601463_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=105&ig_cache_key=Mzk0Njk2Mjc1NTAyNjIwMTc5OA%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW try", "zh": "幾何", "source": "visual"}, {"en": "monochrome", "zh": "黑白", "source": "visual"}], "related": [], "caption": [], "caption_text": "Material [Meta States]\n\nIn our latest Material exploration, we began with a simple question: what happens when we challenge the behaviour of material states?\n\nBy developing custom tools and introducing new external influences into our workflow, we generated and applied animated drivers to a conventional aluminium extrusion, classically defined by precision, sharp angles, and strict geometric rules.\n\nSolid forms began to behave like liquids, and rigid structures transformed into intricate, organic networks. What started as a traditional manufacturing method became a system capable of producing highly cellular, nature-inspired complexity.\n\nThe resulting extrusions feel less like machined components and more like living forms - a representation of how the boundaries between the natural and the manufactured can be blurred.\n\nExplore the full project via the link in bio. \n\nSenior Designer: Georgi Chalakov\nProduction Lead: Sophia Georgiou\nCreative Lead: Simon Graham\nECD: Clayton Welham", "note": "依此媒體顯示畫面整理；貼文技術資訊不代表每一畫面的製作方法。", "ratio": "1 / 1"}, {"id": "discovered-DbGbbtjCFb7-4", "post_id": "DbGbbtjCFb7", "title": "Glenfiddich F1 · 斜向產品光影", "subtitle": "GLENFIDDICH F1", "creator": "found_studio", "image": "https://instagram.ftpe8-1.fna.fbcdn.net/v/t51.82787-15/750894023_18608243977004147_6851725530806266181_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=105&ig_cache_key=Mzk0Njk2Mjc1NTA1MTMyODM5Ng%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=VFS7ESbQqAYQ7kNvwHffqiP&_nc_oc=AdqMqvSdQlNNCd-beRjcrUei1IIToM7qCieJLACtqHFbc6frY_DJl8XA6eFBIdlNOLE&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-1.fna&_nc_gid=f-aLw4VTRpxX9cmywtyK4A&_nc_ss=7a22e&oh=00_AQKKSjem7-4ZC0_bltMRk4_H4rN9cB_jmcyhevrutR9yYQ&oe=6AA5D98B", "url": "https://www.instagram.com/found_studio/p/DbGbbtjCFb7/?img_index=4", "group": "discovered", "saved": false, "collection": "相關 CG", "project": "Glenfiddich F1", "index": 4, "total": 4, "type": "image", "duration": "", "description": "傾斜酒瓶搭配綠色斜向光帶與明亮瓶緣。", "tags": [{"en": "bottle", "zh": "瓶子", "source": "visual"}, {"en": "light trails", "zh": "光軌", "source": "visual"}, {"en": "rim light", "zh": "輪廓光", "source": "visual"}, {"en": "diagonal", "zh": "斜向", "source": "visual"}], "related": [], "caption": [], "caption_text": "To celebrate the partnership between @glenfiddichwhisky and @astonmartinf1, our film used light as a sculptural and energetic storytelling device.\n\nInspired by the intensity of the racetrack, we explored how light could build tempo, rhythm and anticipation throughout the R&D phase, culminating in the hero reveal of the bottle.\n\nView our case study via the link in the bio.\n\nClient: Glenfiddich\nAgency: Made Thought\nECD: Clayton Welham\nExecutive Producer: Felix Jude West\nCreative Director: Ryan Locke\nSenior Producer: Rain Osgood\nDesigners: Georgi Chalakov, Matthew Ball, Jonathan May & Roland Lukacsi", "note": "依此媒體顯示畫面整理；貼文技術資訊不代表每一畫面的製作方法。", "ratio": "1 / 1"}, {"id": "discovered-Dba3WNxiKQ2-4", "post_id": "Dba3WNxiKQ2", "title": "Glenfiddich XS · 金色流動", "subtitle": "GLENFIDDICH XS", "creator": "found_studio", "image": "https://instagram.ftpe8-4.fna.fbcdn.net/v/t51.82787-15/760332328_18610632001004147_3331895736206270882_n.jpg?stp=dst-jpg_e15_tt6&_nc_cat=102&ig_cache_key=Mzk1MjcxNDc0MDE1NzU2OTcyMg%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMzg0MC5zZHIudmlkZW9fZGVmYXVsdF9jb3Zlcl9mcmFtZS5DMyJ9&_nc_ohc=zTCLxou1kroQ7kNvwGV5sH4&_nc_oc=Adq8p29O0SpcdEGOi1o936eswWCOwrM2uSs6YhFD-RWi3jbLsz850I6LEMZi_8AWFgA&_nc_ad=z-m&_nc_cid=0&_nc_zt=23&_nc_ht=instagram.ftpe8-4.fna&_nc_gid=ofB7rV1N6nH6QHHtua49OQ&_nc_ss=7a22e&oh=00_AQIi6KDvdusVcgwp8c2rNoxHbwXsiFCUZa_zr2XX0eO4-g&oe=6AA5D17B", "url": "https://www.instagram.com/found_studio/p/Dba3WNxiKQ2/?im function video(i,detail=false){
 if(i.type!=='video'||!/^https:\/\//.test(i.video_url||''))return '';
 return `<video data-video-src="${esc(i.video_url)}" muted playsinline loop preload="none" ${detail?'controls':''} aria-label="${esc(i.title)}"></video>`;
}
const visibleVideos=new Set();
function canPlay(v){return !document.hidden&&(!$('#modal').open||$('#detail').contains(v))}
function startVideo(v){
 if(!canPlay(v)||v.dataset.failed)return;
 if(!v.getAttribute('src')){v.src=v.dataset.videoSrc;v.muted=true;v.load()}
 const playing=v.play();if(playing)playing.then(()=>{if(!visibleVideos.has(v)||!canPlay(v))v.pause()}).catch(()=>{v.classList.remove('is-playing')});
}
function pauseAll(){document.querySelectorAll('video').forEach(v=>v.pause())}
function syncPlayback(){visibleVideos.forEach(v=>{if(canPlay(v))startVideo(v);else v.pause()})}
const imageObserver=typeof IntersectionObserver==='undefined'?null:new IntersectionObserver(entries=>{
 entries.forEach(({target,isIntersecting})=>{if(isIntersecting){target.src=target.dataset.src;imageObserver.unobserve(target)}});
},{rootMargin:'180px 0px'});
const videoObserver=typeof IntersectionObserver==='undefined'?null:new IntersectionObserver(entries=>{
 entries.forEach(({target,isIntersecting,intersectionRatio})=>{
  if(isIntersecting&&intersectionRatio>=0.25){visibleVideos.add(target);startVideo(target)}
  else{visibleVideos.delete(target);target.pause()}
 });
},{threshold:[0,0.25]});
function observeMedia(root){
 root.querySelectorAll('img[data-src]').forEach(img=>{if(imageObserver)imageObserver.observe(img);else img.src=img.dataset.src});
 root.querySelectorAll('video[data-video-src]').forEach(v=>{
  v.muted=true;
  v.addEventListener('playing',()=>v.classList.add('is-playing'));
  v.addEventListener('error',()=>{v.dataset.failed='true';v.classList.remove('is-playing');v.pause()});
  if(videoObserver)videoObserver.observe(v);else v.controls=true;
 });
}
function releaseMedia(root){
 root.querySelectorAll('img').forEach(img=>imageObserver?.unobserve(img));
 root.querySelectorAll('video').forEach(v=>{videoObserver?.unobserve(v);visibleVideos.delete(v);v.pause();v.removeAttribute('src');v.load()});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseAll();else syncPlayback()});
window.addEventListener('pagehide',pauseAll);

function expand(q){q=q.toLowerCase().trim().replace(/^#/,'');return [...new Set([q,...synonyms.filter(g=>g.includes(q)).flat()])].filter(Boolean)}
const creatorAliases={studiotendril:['Tendril','Studio Tendril'],panoplycreative:['Panoply','Panoply Creative'],buildersclub_studios:['Builders Club'],found_studio:['Found','Found Studio'],mondlichtstudios:['Mondlicht Studios','Mondlicht Studio'],general_definition:['General Definition'],_studiomulti:['Studio Multi'],'yacht.studio':['Yacht Studio'],sidefxhoudini:['SideFX','SideFX Houdini']};
function credits(i){return [i.creator,i.publisher,i.studio,i.production_company,...(i.collaborators||[]),...String(i.creator||'').split(' · ').flatMap(name=>creatorAliases[name]||[]),...(i.credit_aliases||[])].filter(Boolean)}
function creditKey(s){return String(s).normalize('NFKC').toLowerCase().replace(/[\s@._·-]+/g,'')}
function hay(i){return [i.title,i.project,i.subtitle,...credits(i),i.description,i.collection,i.caption_text,...i.tags.flatMap(t=>[t.en,t.zh]),...i.related.flatMap(t=>[t.en,t.zh]),...i.caption].join(' ').toLowerCase()}
function containsTerm(text,term){if(!/^[a-z0-9 -]+$/i.test(term))return text.includes(term);let start=0;while((start=text.indexOf(term,start))!==-1){const before=text[start-1]||'',after=text[start+term.length]||'';if(!/[a-z0-9]/i.test(before)&&!/[a-z0-9]/i.test(after))return true;start++;}return false;}
function matches(i,q){const terms=expand(q);return !terms.length||terms.some(w=>containsTerm(hay(i),w)||(creditKey(w)&&credits(i).some(c=>creditKey(c).includes(creditKey(w)))))}
function image(i,extra=''){return `<img data-src="${esc(i.image)}" decoding="async" loading="lazy" alt="${esc(i.title)}" referrerpolicy="no-referrer" ${extra}>`}
function tag(t,cls=''){return `<button class="tag ${cls}" data-query="${esc(t.en)}">${esc(t.en)}${t.en.toLowerCase()!==t.zh.toLowerCase()?' · '+esc(t.zh):''}</button>`}
function scope(i){return i.group==='expansion'?'作品影片參考':i.group==='ref'?'延伸貼文預覽':i.total>1?`輪播 ${i.index} / ${i.total}`:'獨立影片'}
function badge(i){return i.group==='ref'?'↗ 延伸參考':i.type==='image'?'▧ 圖片':'▶ '+i.duration}
function render(){
 releaseMedia($('#grid'));
 const q=$('#search').value.trim(),source=$('#group').value,collection=$('#collection').value;
 const shown=items.filter(i=>matches(i,q)&&matches(i,selected)&&(source==='all'||(source==='saved'?i.saved:i.group===source))&&(collection==='all'||i.collection===collection));
 $('#filters').innerHTML=groups.map(([name,value])=>`<button class="chip ${selected===value?'active':''}" data-filter="${value}" aria-pressed="${selected===value}">${name}</button>`).join('');
 $('#count').textContent=`${shown.length} 個參考素材${q?' · 搜尋「'+q+'」':''}`;
 const expanded=expand(q).filter(w=>w!==q.toLowerCase());$('#expanded').textContent=expanded.length?'關聯搜尋：'+expanded.join(' · '):'每個輪播項目，獨立探索';
 $('#empty').style.display=shown.length?'none':'block';
 $('#grid').innerHTML=shown.map(i=>`<article class="card"><button class="visual" data-open="${i.id}" style="--ratio:${i.ratio}" aria-label="查看${esc(i.title)}">${image(i)}${video(i)}</button></article>`).join('');
 observeMedia($('#grid'));
 $('#grid').querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>img.closest('.card').classList.add('broken')));
}
function openItem(id){
 const i=items.find(i=>i.id===id);if(!i)return;
 releaseMedia($('#detail')); pauseAll();
 const keys=i.tags.map(t=>t.en.toLowerCase());
 const similar=items.filter(j=>j.id!==id).map(j=>({j,score:j.tags.reduce((n,t)=>n+keys.includes(t.en.toLowerCase()),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
 $('#detail').innerHTML=`<div class="detail"><div class="preview">${video(i,true)||image(i)}<a class="source" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${i.group==='expansion'?'作品報導與署名':i.type==='video'?'觀看原影片':'開啟原貼文'} ↗</a></div><div class="detailbody"><div class="eyebrow">${esc(scope(i))}${i.collection?' / '+esc(i.collection):''}</div><h2>${esc(i.title)}</h2><p>${i.group==='expansion'?'':'@'}${esc(i.creator)}${i.reported_at?' · 報導於 '+esc(i.reported_at):''}${i.published_at?' · 發布於 '+esc(i.published_at.slice(0,10)):''}</p><p>${esc(i.description)}</p><h3>${i.group==='expansion'?'作品標籤 · 依來源說明':'個別素材標籤'}</h3><div class="tags">${i.tags.map(t=>tag(t)).join('')}</div>${i.related.length?'<h3>延伸搜尋詞 · 非已確認技術</h3><div class="tags">'+i.related.map(t=>tag(t,'relatedtag')).join('')+'</div>':''}${i.caption.length?'<h3>貼文 Hashtags</h3><div class="tags">'+i.caption.map(t=>`<button class="tag" data-query="${esc(t)}">#${esc(t)}</button>`).join('')+'</div>':''}${i.caption_text?'<details class="caption"><summary>查看原貼文文字</summary><p>'+esc(i.caption_text)+'</p></details>':''}${i.film_links?.length?'<h3>影片連結</h3><div class="tags">'+i.film_links.map((url,n)=>`<a class="tag" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${n===0?'觀看原影片':'延伸影片 '+(n+1)} ↗</a>`).join('')+'</div>':''}<p class="note">${esc(i.note)}</p>${similar.length?'<h3>繼續探索相關素材</h3><div class="relatedgrid">'+similar.map(({j})=>`<button class="smallcard" data-open="${j.id}">${image(j)}${esc(j.title)}</button>`).join('')+'</div>':''}</div></div>`;
 if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0;observeMedia($('#detail'));
}
function reset(){selected='';$('#search').value='';$('#group').value='all';$('#collection').value='all';render()}
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]'),q=e.target.closest('[data-query]'),f=e.target.closest('[data-filter]');if(o)openItem(o.dataset.open);if(q){$('#search').value=q.dataset.query;selected='';$('#group').value='all';$('#collection').value='all';$('#modal').close();render();window.scrollTo({top:0,behavior:'smooth'})}if(f){selected=f.dataset.filter;render()}});
$('#search').addEventListener('input',render);$('#group').addEventListener('change',render);$('#collection').addEventListener('change',render);
$('#clear').onclick=()=>{$('#search').value='';render();$('#search').focus()};$('#reset').onclick=reset;$('#home').onclick=$('#explore').onclick=e=>{e.preventDefault();reset();window.scrollTo({top:0,behavior:'smooth'})};$('#close').onclick=()=>$('#modal').close();$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});
$('#modal').addEventListener('close',()=>{releaseMedia($('#detail'));syncPlayback()});
render();

</script></body></html>
